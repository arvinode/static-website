<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f4f7fb;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #facc15;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000010;
        }

        h1 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #166534;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #172554;
            color: white;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
            }

            .container {
                margin: 25px 15px;
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>My Website</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="service.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="container">
    <h1>Contact Us</h1>
    <p class="description">
        Have a question? Fill out the form below.
    </p>

    <form id="contactForm">
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="subject">Subject</label>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter the subject"
            required
        >

        <label for="messageText">Message</label>
        <textarea
            id="messageText"
            name="message"
            rows="5"
            placeholder="Write your message"
            required
        ></textarea>

        <button type="submit">Submit Message</button>

        <p id="message" role="status" aria-live="polite"></p>
    </form>
</main>

<footer>
    <p>&copy; <span id="year"></span> My Website. All rights reserved.</p>
</footer>

<script>
    document.getElementById("year").textContent =
        new Date().getFullYear();

    document.getElementById("contactForm").addEventListener(
        "submit",
        function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();

            document.getElementById("message").textContent =
                "Thank you, " + name +
                "! This is a demo form. Your message was not sent.";

            this.reset();
        }
    );
</script>

</body>
</html>
