<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
            background: white;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000010;
        }

        h1 {
            font-size: 100px;
            line-height: 1.2;
            color: #1e3a8a;
        }

        h2 {
            margin: 15px 0;
            font-size: 28px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #2563eb;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 70px;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<main class="error-container">
    <h1>404</h1>

    <h2>Oops! Page Not Found</h2>

    <p>
        Sorry, the page you are looking for does not exist
        or may have been moved.
    </p>

    <a href="index.html">Back to Home</a>
</main>

<script>
    console.log("404 error page loaded.");
</script>

</body>
</html>
